version: 2
updates:
  # uv updates both pyproject.toml and uv.lock.
  - package-ecosystem: uv
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    labels: [dependencies]
    commit-message:
      prefix: deps
    groups:
      runtime:
        patterns:
          - "fastapi"
          - "httptools"
          - "pydantic*"
          - "uvicorn"
          - "uvloop"
      dev:
        patterns:
          - "httpx2"
          - "pytest*"
          - "ruff"
          - "ty"

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    labels: [dependencies]
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    labels: [dependencies]
    commit-message:
      prefix: docker
