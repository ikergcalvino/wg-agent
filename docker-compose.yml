services:
  wg-agent:
    build: .
    container_name: wg-agent
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
    volumes:
      - /etc/wireguard:/etc/wireguard:rw
    environment:
      # Required, at least 16 characters. Set it in the shell or in a .env file, e.g. `openssl rand -hex 32`.
      API_KEY: ${API_KEY:?Set API_KEY to a random string of at least 16 characters}
      # Optional, also from the shell or .env.
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      # Must match the volume above.
      CONFIG_DIR: /etc/wireguard
